name: Demo

# Builds the WebAssembly demo and publishes it on GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["crates/**", "demo/**", "scripts/build-demo.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      # No wasm-opt here: Ubuntu's binaryen breaks wasm-bindgen's externref table
      # ("WebAssembly.Table.grow(): failed to grow table") and the decoder never starts.
      - run: ./scripts/build-demo.sh
      - name: Version the decoder files (avoids stale browser caches)
        run: sed -i "s/const VERSION = \"dev\"/const VERSION = \"${GITHUB_SHA::8}\"/" demo/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

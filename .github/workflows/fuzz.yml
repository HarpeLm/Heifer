name: Fuzz

# Runs every fuzz target for about 50 minutes every night, each on its own machine. The corpus is cached between runs so
# that fuzzing resumes where it stopped. Crashes make the run fail and are uploaded as artifacts.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Fuzzing duration (e.g. 30m, 2h; GitHub limits jobs to 6h)"
        default: "50m"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [hevc, decode, parallel, container, cabac]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # Built from source: the prebuilt binary targets musl and fails to build the fuzzers.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: |
            fuzz/corpus/${{ matrix.target }}
            tests/conformance
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Download seed files
        run: |
          ./scripts/fetch-fixtures.sh
          ./scripts/fetch-real.sh
          ./scripts/fetch-fuzz-corpus.sh
          ./scripts/fetch-conformance.sh

      - name: Fuzz
        run: ./scripts/fuzz.sh "${{ github.event.inputs.duration || '50m' }}" ${{ matrix.target }}

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            fuzz/corpus/${{ matrix.target }}
            tests/conformance
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts
            fuzz/logs

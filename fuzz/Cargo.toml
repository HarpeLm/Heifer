[package]
name = "heifer-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
heifer = { path = "../crates/heifer", features = ["image"] }
heifer-isobmff = { path = "../crates/heifer-isobmff" }
heifer-hevc-dec = { path = "../crates/heifer-hevc-dec" }
heifer-av1-dec = { path = "../crates/heifer-av1-dec" }
heifer-hevc-enc = { path = "../crates/heifer-hevc-enc" }
image = { version = "0.25.8", default-features = false }

# Kept out of the main workspace.
[workspace]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false


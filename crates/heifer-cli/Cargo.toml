[package]
name = "heifer-cli"
description = "Convert HEIC/HEIF photos and .heics sequences to/from PNG, JPEG, WebP, GIF and APNG — pure Rust, no libheif or ffmpeg"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/HarpeLm/Heifer/tree/main/crates/heifer-cli"
keywords = ["heic", "heif", "converter", "cli", "image"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "heifer"
path = "src/main.rs"

[dependencies]
heifer = { path = "../heifer", version = "0.9.0", features = ["image"] }
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif"] }
# APNG output (already used by `image` for PNG).
png = "0.18"

[lints]
workspace = true

[package]
name = "heifer"
description = "Pure-Rust HEIF/HEIC image decoder and encoder: no C dependencies, no unsafe code"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/heifer"
keywords = ["heic", "heif", "image", "decoder", "encoder"]
categories = ["multimedia::images", "multimedia::encoding", "parser-implementations", "wasm"]

[dependencies]
thiserror.workspace = true
heifer-isobmff.workspace = true
heifer-hevc-dec.workspace = true
heifer-hevc-enc = { workspace = true, optional = true }
image = { version = "0.25.8", default-features = false, optional = true }

[features]
default = ["encoder"]
# HEIC encoding (the `heifer-hevc-enc` crate). Without it, heifer only decodes.
encoder = ["dep:heifer-hevc-enc"]
# Integration with the `image` crate (decoder, encoder, hooks for image::open).
image = ["dep:image"]

[dev-dependencies]
image = { version = "0.25.8", default-features = false, features = ["png"] }

# Tests and examples that encode their inputs need the encoder.
[[test]]
name = "auxiliary"
required-features = ["encoder"]

[[test]]
name = "color"
required-features = ["encoder"]

[[test]]
name = "encode"
required-features = ["encoder"]

[[test]]
name = "reader"
required-features = ["encoder"]

[[test]]
name = "sequence"
required-features = ["encoder"]

[[test]]
name = "hdr_encode"
required-features = ["encoder"]

[[test]]
name = "hdr_transfer"
required-features = ["encoder"]

[[test]]
name = "robustness"
required-features = ["encoder"]

[[test]]
name = "image_crate"
required-features = ["encoder", "image"]

[[example]]
name = "to_heic"
required-features = ["encoder"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[package]
name = "heifer"
description = "Pure-Rust HEIF/HEIC image decoder: no C dependencies, no unsafe code"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/heifer"
keywords = ["heic", "heif", "hevc", "image", "decoder"]
categories = ["multimedia::images", "parser-implementations", "wasm"]

[dependencies]
thiserror.workspace = true
heifer-isobmff.workspace = true
heifer-hevc-dec.workspace = true
heifer-hevc-enc.workspace = true
image = { version = "0.25.8", default-features = false, optional = true }

[features]
# Integration with the `image` crate (decoder + hooks for image::open).
image = ["dep:image"]

[dev-dependencies]
image = { version = "0.25.8", default-features = false, features = ["png"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HarpeLm/Heifer"
homepage = "https://harpelm.github.io/Heifer/"

[workspace.dependencies]
heifer-isobmff = { path = "crates/heifer-isobmff", version = "0.9.0" }
heifer-hevc-dec = { path = "crates/heifer-hevc-dec", version = "0.9.0" }
heifer-hevc-enc = { path = "crates/heifer-hevc-enc", version = "0.9.0" }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The codecs run conformance streams and real photos in their tests: unoptimized, those take
# most of the suite's time. Optimizing them keeps overflow checks and debug assertions on.
[profile.dev.package.heifer-hevc-dec]
opt-level = 3

[profile.dev.package.heifer-hevc-enc]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

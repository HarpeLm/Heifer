<rect x="190" y="153" width="263.3" height="11" rx="2" fill="#5b9be0"/><text x="459.3" y="163" font-size="11.5" fill="#9198a1">102 ms</text>
<rect x="190" y="167" width="347.9" height="11" rx="2" fill="#2f5784"/><text x="543.9" y="177" font-size="11.5" fill="#9198a1">454 ms</text>
<rect x="190" y="181" width="259.6" height="11" rx="2" fill="#d39a5a"/><text x="455.6" y="191" font-size="11.5" fill="#9198a1">96 ms</text>
<text x="178" y="245.0" font-size="13" text-anchor="end" fill="#e6edf3">8000×6000, 48 MP</text>

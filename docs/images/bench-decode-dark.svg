<rect x="404" y="372" width="11" height="11" rx="2" fill="#d39a5a"/><text x="421" y="381.5" font-size="12" fill="#9198a1">ffmpeg (libavcodec)</text>
<text x="178" y="109.0" font-size="13" text-anchor="end" fill="#e6edf3">Xiaomi, 5 MP</text>
<rect x="190" y="85" width="227.7" height="11" rx="2" fill="#5b9be0"/><text x="423.7" y="95" font-size="11.5" fill="#9198a1">55 ms</text>

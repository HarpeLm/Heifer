<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" rx="8" fill="#0d1117"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#e6edf3">Decoding time: heifer vs ffmpeg (lower is better)</text>
<text x="24" y="56" font-size="12.5" fill="#9198a1">Median of 5 runs, full decode of the primary image · Apple M5, 10 cores</text>
<rect x="24" y="372" width="11" height="11" rx="2" fill="#5b9be0"/><text x="41" y="381.5" font-size="12" fill="#9198a1">heifer, all cores</text>
